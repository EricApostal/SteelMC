[files]
extend-exclude = ["**/build_assets/**", "*.json"]

[type.locale]
extend-glob = ["**/locale.rs"]
check-file = false

[default.extend-words]
flate = "flate"
strat = "strat"
axe = "axe"
BlockBehaviour = "BlockBehaviour"
behaviour = "behaviour"
interruptable = "interruptable"
neighbour = "neighbour"
# Vanilla stronghold piece-type IDs (shs, shsd, shrc, ...).
shs = "shs"
# Vanilla carver tag name (minecraft:overworld_carver_replaceables).
replaceables = "replaceables"
# Mojang's shipped translation key (snbt.parser.undescore_not_allowed).
undescore = "undescore"
# Vanilla block tag name minecraft:convertable_to_mud
convertable = "convertable"
# Vanilla block name: OCHRE_FROGLIGHT.
OCHRE = "OCHRE"
# Vanilla `AbstractHurtingProjectile.INITAL_ACCELERATION_POWER`.
INITAL = "INITAL"
# Vanilla `ItemEntity.areMergable`.
mergable = "mergable"
Mergable = "Mergable"
# Vanilla `NaturalSpawner.isValidSpawnPostitionForType`.
Postition = "Postition"
# Vanilla `DoubleBlockCombiner.combineWithNeigbour`.
Neigbour = "Neigbour"
# Vanilla `FishingHook.syncronizedRandom`.
syncronized = "syncronized"
# Vanilla `LivingEntity.DATA_PLAYER_MODE_CUSTOMISATION`.
CUSTOMISATION = "CUSTOMISATION"
# Vanilla `Piglin.CHANCE_OF_WEARING_EACH_ARMOUR_ITEM`.
ARMOUR = "ARMOUR"
# Vanilla `FunctionCommand.ERROR_FUNCTION_INSTANTATION_FAILURE`.
INSTANTATION = "INSTANTATION"
# Vanilla `ThrownTrident.isAcceptibleReturnOwner`.
Acceptible = "Acceptible"

[default.extend-identifiers]
player_mode_customisation = "player_mode_customisation"
# Vanilla `LavaFluid.hasFlammableNeighbours`.
hasFlammableNeighbours = "hasFlammableNeighbours"
# Vanilla `Containers.updateNeighboursAfterDestroy`.
updateNeighboursAfterDestroy = "updateNeighboursAfterDestroy"
# Vanilla `TransportItemsBetweenContainers.onStartTravelling`.
onStartTravelling = "onStartTravelling"

[default]
locale = "en-us"
